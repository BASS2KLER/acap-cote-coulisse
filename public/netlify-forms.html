<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8" /><title>Formulaires ACAP</title></head>
<body>

<!-- Formulaire Séance d'essai -->
<form name="essai" data-netlify="true" hidden>
  <input name="prenom" type="text" />
  <input name="nom" type="text" />
  <input name="telephone" type="tel" />
  <input name="email" type="email" />
  <input name="atelier" type="text" />
  <input name="experience" type="text" />
</form>

<!-- Formulaire Inscription -->
<form name="inscription" data-netlify="true" hidden>
  <input name="prenom" type="text" />
  <input name="nom" type="text" />
  <input name="date_naissance" type="date" />
  <input name="telephone" type="tel" />
  <input name="adresse" type="text" />
  <input name="email" type="email" />
  <input name="atelier" type="text" />
  <input name="experience" type="text" />
  <input name="droit_image" type="checkbox" />
  <input name="whatsapp" type="checkbox" />
</form>

<!-- Formulaire Question -->
<form name="question" data-netlify="true" hidden>
  <input name="nom_complet" type="text" />
  <input name="email" type="email" />
  <input name="sujet" type="text" />
  <textarea name="message"></textarea>
</form>

</body>
</html>
